<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ethereum Consensus Explorer</title>
    <link rel = "preconnect" href = "https://fonts.googleapis.com">
    <link rel = "preconnect" href = "https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel = "stylesheet">

    <style>
    :root {
      --bg:        #0A0C12;
      --panel:     #12151F;
      --panel-2:   #0E1119;
      --border:    #212636;
      --border-soft:#1a1f2e;
      --text:      #E7EAF3;
      --muted:     #79839B;
      --faint:     #49516B;
      --hash:      #AEB9D6;
      --accent:    #8B93FF;
      --final:     #46D6A0;
      --final-dim: rgba(70,214,160,0.12);
      --pending:   #F4C152;
      --pending-dim:rgba(244,193,82,0.12);
      --radius:    14px;
    }
 
    * { box-sizing: border-box; }
 
    body {
      margin: 0;
      background:
        radial-gradient(1200px 600px at 50% -10%, #121626 0%, rgba(18,22,38,0) 60%),
        var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
 
    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
 
    /* ---- top bar ---- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border-soft);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
      transform: translateY(1px);
    }
    .brand-name {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.01em;
    }
    .net {
      display: flex; align-items: center; gap: 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .pulse {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--final);
      box-shadow: 0 0 0 0 rgba(70,214,160,0.55);
      animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(70,214,160,0.5); }
      70%  { box-shadow: 0 0 0 7px rgba(70,214,160,0); }
      100% { box-shadow: 0 0 0 0 rgba(70,214,160,0); }
    }
 
    /* ---- search ---- */
    .search {
      display: flex; gap: 10px;
      margin: 26px 0 22px;
    }
    #slotInput {
      flex: 1;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    #slotInput::placeholder { color: var(--faint); }
    #slotInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139,147,255,0.15);
    }
    #search {
      background: var(--accent);
      color: #0A0C12;
      border: none;
      border-radius: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      font-size: 14px;
      padding: 0 20px;
      cursor: pointer;
      transition: filter .15s ease, transform .05s ease;
    }
    #search:hover { filter: brightness(1.08); }
    #search:active { transform: translateY(1px); }
 
    /* ---- panels ---- */
    .panel {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 16px;
    }
    .fade { animation: rise .4s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
 
    /* ---- block head ---- */
    .block-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 18px; flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .slot-eyebrow {
      display: block;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px; letter-spacing: 0.22em;
      color: var(--muted); margin-bottom: 4px;
    }
    .slot-num {
      font-size: 30px; font-weight: 700;
      letter-spacing: -0.02em; line-height: 1;
    }
    .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .chip {
      display: flex; flex-direction: column; gap: 2px;
      padding: 7px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border-soft);
      border-radius: 9px;
    }
    .chip-k {
      font-family: "IBM Plex Mono", monospace;
      font-size: 9.5px; letter-spacing: 0.16em; color: var(--muted);
    }
    .chip-v {
      font-family: "IBM Plex Mono", monospace;
      font-size: 14px; font-weight: 500; color: var(--text);
    }
    .badge {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
      padding: 8px 13px; border-radius: 9px;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .badge::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
    }
    .badge-final   { color: var(--final);   background: var(--final-dim); }
    .badge-pending { color: var(--pending); background: var(--pending-dim); }
 
    /* ---- roots: the hero material ---- */
    .roots { display: grid; gap: 12px; }
    .field {
      background: var(--panel-2);
      border: 1px solid var(--border-soft);
      border-left: 2px solid var(--accent);
      border-radius: 10px;
      padding: 13px 16px;
    }
        .field-k {
        display: block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px; letter-spacing: 0.18em; color: var(--muted);
        margin-bottom: 7px;
        }
        .field-v {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13.5px; letter-spacing: 0.04em;
        color: var(--hash); word-break: break-all;
        }
        .field-v .ox { color: var(--faint); }
    
        /* ---- attestations ---- */
        .atts-head {
        display: flex; align-items: baseline; gap: 12px;
        margin-bottom: 16px;
        }
        .atts-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
        .atts-count {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px; color: var(--muted);
        background: var(--panel-2); border: 1px solid var(--border-soft);
        border-radius: 20px; padding: 2px 10px;
        }
        .att-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 11px 4px;
        border-top: 1px solid var(--border-soft);
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        transition: background .12s ease;
        }
        .att-row:hover { background: rgba(255,255,255,0.015); }
        .att-k { color: var(--faint); margin-right: 8px; letter-spacing: 0.08em; }
        .att-v { color: var(--text); }
        .att-slot { color: var(--hash); }
        .atts-more {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11.5px; color: var(--muted);
        padding-top: 13px; border-top: 1px solid var(--border-soft);
        margin-top: 2px;
        }
    
        /* ---- states ---- */
        .state {
        display: flex; flex-direction: column; align-items: flex-start;
        gap: 8px;
        }
        .state-title {
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px; color: var(--text);
        }
        .state-sub { font-size: 13.5px; color: var(--muted); }
        .skeleton .bar {
        height: 12px; border-radius: 6px;
        background: linear-gradient(90deg, #171b28 0%, #1e2333 50%, #171b28 100%);
        background-size: 200% 100%;
        animation: shimmer 1.3s linear infinite;
        margin: 10px 0;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }
    
        /* ---- footer ---- */
        .foot {
        margin-top: 28px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11.5px; color: var(--faint);
        line-height: 1.7;
        }
        .foot a { color: var(--muted); text-decoration: none; }
        .foot a:hover { color: var(--accent); }
    
        @media (max-width: 560px) {
        .slot-num { font-size: 24px; }
        .search { flex-direction: column; }
        #search { padding: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class = "wrap">
        <header class = "topbar">
            <div class = "brand">
                <span class = "brand-mark">&#9670;</span>
                <span class = "brand-name">Ethereum Consensus Explorer</span>
            </div>
            <div class = "net">
                <span class = "pulse"></span> mainnet &middot; live
            </div>
        </header>
        <div class="search">
            <input  id="slotInput" aria-label="Slot number" placeholder="slot number, e.g. 15065085 — or leave blank for head">
            <button id="search">Search</button>
        </div>
    
        <main id="app"></main>
    
        <footer class="foot">
            Consensus-layer data via the public Beacon Node API.<br>
            Built by <a href="https://github.com/aarishnaiyer" target="_blank" rel="noopener">Aarish Naiyer</a> alongside Ethereum Foundation protocol fellowship work on light-client checkpoint sync.
        </footer>
    </div>

    <script>
        const BEACON = "https://ethereum-beacon-api.publicnode.com";
        const app = document.getElementById("app");
    
        const fmt = n => Number(n).toLocaleString("en-US");
    
        function loadingView() {
        app.innerHTML = `
            <section class="panel skeleton">
            <div class="state-title" style="margin-bottom:14px">Fetching slot&hellip;</div>
            <div class="bar" style="width:40%"></div>
            <div class="bar" style="width:100%"></div>
            <div class="bar" style="width:100%"></div>
            </section>`;
        }
    
        function notFoundView(id) {
        app.innerHTML = `
            <section class="panel fade">
            <div class="state">
                <div class="state-title">No block for slot ${id}</div>
                <div class="state-sub">This slot may have been skipped, or it hasn't been produced yet. Try a lower slot number, or leave the box blank to load the chain head.</div>
            </div>
            </section>`;
        }
    
        function errorView(msg) {
        app.innerHTML = `
            <section class="panel fade">
            <div class="state">
                <div class="state-title">Couldn't reach the beacon node</div>
                <div class="state-sub">${msg}. Check your connection and try again.</div>
            </div>
            </section>`;
        }
    
        function hashHTML(root) {
        // dim the 0x prefix, foreground the digest
        return root.startsWith("0x")
            ? `<span class="ox">0x</span>${root.slice(2)}`
            : root;
        }
    
        async function loadBlock(blockId = "head") {
        loadingView();
        try {
            const res = await fetch(`${BEACON}/eth/v2/beacon/blocks/${blockId}`);
    
            if (res.status === 404) { notFoundView(blockId); return; }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
    
            const json = await res.json();
            const scRes = await fetch(`${BEACON}/eth/v1/beacon/states/${blockId}/sync_committees`);
            const scJson = await scRes.json();
            const validators = scJson.data.validators; 
            const validatorsShown = validators.slice(0,16);
            const scRows = validatorsShown.map(v => 
              `<div class="att-row"><span class = "att-v">validator ${v}</span></div>`).join("");
            const msg  = json.data.message;
            const atts = msg.body.attestations || [];
            const epoch = Math.floor(Number(msg.slot) / 32);
            const finalized = json.finalized;
    
            const shown = atts.slice(0, 12);
            const rows = shown.map(a => `
            <div class="att-row">
                <span><span class="att-k">committee</span><span class="att-v">${a.data.index}</span></span>
                <span><span class="att-k">slot</span><span class="att-slot">${fmt(a.data.slot)}</span></span>
            </div>`).join("");
            const more = atts.length > shown.length
            ? `<div class="atts-more">+ ${fmt(atts.length - shown.length)} more attestations</div>`
            : "";
    
            app.innerHTML = `
            <section class="panel fade">
                <div class="block-head">
                <div class="slot-id">
                    <span class="slot-eyebrow">SLOT</span>
                    <span class="slot-num">#${fmt(msg.slot)}</span>
                </div>
                <div class="meta">
                    <span class="chip"><span class="chip-k">EPOCH</span><span class="chip-v">${fmt(epoch)}</span></span>
                    <span class="chip"><span class="chip-k">PROPOSER</span><span class="chip-v">${msg.proposer_index}</span></span>
                    <span class="badge ${finalized ? "badge-final" : "badge-pending"}">${finalized ? "FINALIZED" : "PENDING"}</span>
                </div>
                </div>
                <div class="roots">
                <div class="field">
                    <span class="field-k">PARENT ROOT</span>
                    <span class="field-v">${hashHTML(msg.parent_root)}</span>
                </div>
                <div class="field">
                    <span class="field-k">STATE ROOT</span>
                    <span class="field-v">${hashHTML(msg.state_root)}</span>
                </div>
                </div>
            </section>
    
            <section class="panel fade">
                <div class="atts-head">
                <span class="atts-title">Attestations</span>
                <span class="atts-count">${fmt(atts.length)}</span>
                </div>
                <div class="atts-list">${rows || '<div class="state-sub">No attestations in this block.</div>'}${more}</div>
            </section>
            <section class ="panel fade">
              <div class ="atts-head">
                <span class = "atts-title">Sync Committee</span>
                <span class = "atts-count">${validators.length}</span>
              </div>
              <div class ="atts-list">${scRows}</div>
            </section>
            `;
        } catch (err) {
            errorView(err.message);
            console.error(err);
        }
        }
    
        function runSearch() {
        const val = document.getElementById("slotInput").value.trim();
        loadBlock(val || "head");
        }
    
        document.getElementById("search").addEventListener("click", runSearch);
        document.getElementById("slotInput").addEventListener("keydown", e => {
        if (e.key === "Enter") runSearch();
        });
    
        loadBlock();
    </script>
</body>
</html>
