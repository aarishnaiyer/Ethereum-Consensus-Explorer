<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Slot-Explorer</title>
    <style>
        body { font-family: monospace; background: #0d1117; color: #c9d1d9; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        h1 { color:#58a6ff}
        .card { border: 1px solid #30363d; border-radius: 8px ; padding: 16px; margin-bottom: 16px; }
        .label { color:#8b949e; }
        .value {word-break:break-all ; }
        .badge {display: inline-block; background:#238636; color: white; padding: 2px 10px; border-radius: 12px; font-size: 14px;}
    </style>
</head>
<body>
    <h1>Slot Explorer</h1>
    <input id="slotInput" placeholder="Slot number, e.g. 15065085">
    <button id="search">Search</button>
    <div id="app"></div>

    <script>
        const BEACON = "https://ethereum-beacon-api.publicnode.com";
        async function loadBlock(blockId="head"){
            const app = document.getElementById("app");
            app.innerHTML="<p>Loading...</p>";
            try {
                const res  = await fetch (`${BEACON}/eth/v2/beacon/blocks/${blockId}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const json = await res.json();

                const msg = json.data.message;
                const atts = msg.body.attestations;

                app.innerHTML=`
                <div class = "card">
                    <span class = "badge">${json.finalized ? "FINALIZED" : "PENDING"}</span>
                    <h2>Slot #${msg.slot}</h2>
                    <p><span class = "label">Proposer:</span> <span class = "value">${msg.proposer_index}</span></p>
                    <p><span class = "label">Parent root:</span> <span class = "value">${msg.parent_root}</span></p>
                    <p><span class = "label">State root:</span> <span class = "value">${msg.state_root}</span></p>
                </div>
                <div class = "card">
                    <h3>Attestations (${atts.length})</h3>
                    ${atts.slice(0,8).map(a=>
                        `<p><span class = "label">Committee ${a.data.index}</span> - slot ${a.data.slot}</p>`
                    ).join("")}
                </div>
                `;
            
            }catch (err) {
                app.innerHTML = `<div class = "card"><span class = "label">Error:</span> ${err.message}</div>`;
                console.error(err);
            }
            document.getElementById("search").addEventListener("click", () => {
                const slot = document.getElementById("slotInput").value;
                loadBlock(slot);
            });
        }
        loadBlock()
    </script>
</body>
</html>
